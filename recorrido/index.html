<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>La Amelia | Recorrido virtual</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/core@5.15.1/index.css">

<style>
  :root {
    --panel: rgba(18, 26, 24, .66);
    --panel-solid: #121a18;
    --linea: rgba(255, 255, 255, .16);
    --texto: #f3f5ef;
    --texto-suave: rgba(243, 245, 239, .72);
    --marca: #f0c94a;
    --salto: #b8966b;   /* color del botón 360 (marrón claro / beige) */
    --fuente: "Manrope", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;

    /* Colores de disponibilidad: suaves, para no tapar la foto */
    --disponible: #6fae78;
    --reservado: #d9b75a;
    --vendido: #c9695f;
    --no-disponible: #5a5a5a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #0c1210; font-family: var(--fuente); color: var(--texto); overflow: hidden; }
  #visor { position: fixed; inset: 0; }

  .vidrio {
    background: var(--panel); border: 1px solid var(--linea);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }

  /* --- Título + leyenda --- */
  .titulo {
    position: fixed; z-index: 10;
    top: calc(14px + env(safe-area-inset-top, 0px)); left: 14px;
    max-width: calc(100% - 90px);
    padding: 10px 16px 11px; border-radius: 14px;
    pointer-events: none;
  }
  .titulo small { display: block; font-size: 12px; font-weight: 500; color: var(--texto-suave); margin-bottom: 2px; }
  .titulo strong { display: block; font-size: 18px; font-weight: 700; letter-spacing: -.01em; }
  .leyenda {
    display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 8px; padding-top: 8px;
    border-top: 1px solid var(--linea);
    font-size: 12px; font-weight: 600; color: var(--texto-suave);
  }
  .leyenda span { display: inline-flex; align-items: center; gap: 5px; }
  .leyenda i { width: 10px; height: 10px; border-radius: 3px; border: 1.5px solid rgba(255,255,255,.9); }
  .estado-datos { margin-top: 6px; font-size: 12px; color: var(--marca); }
  .estado-datos:empty { display: none; }

  /* --- Pantalla completa --- */
  .btn-redondo {
    width: 46px; height: 46px; border-radius: 50%;
    display: grid; place-items: center; cursor: pointer; color: var(--texto);
    transition: background .15s;
  }
  .btn-redondo:hover { background: rgba(18, 26, 24, .9); }
  .btn-redondo svg { width: 20px; height: 20px; }
  #pantalla-completa {
    position: fixed; z-index: 10;
    top: calc(14px + env(safe-area-inset-top, 0px)); right: 14px;
  }

  /* --- Botones de subir / bajar --- */
  .alturas {
    position: fixed; z-index: 10; left: 0; right: 0;
    bottom: calc(24px + env(safe-area-inset-bottom, 0px));
    display: flex; justify-content: center; gap: 8px; pointer-events: none;
  }
  .alturas:empty { display: none; }
  .altura {
    pointer-events: auto; display: inline-flex; align-items: center; gap: 8px;
    padding: 10px 16px 10px 12px; border-radius: 22px; cursor: pointer;
    color: var(--texto); font: 700 14px/1 var(--fuente);
  }
  .altura:hover { background: rgba(18, 26, 24, .9); }
  .altura svg { width: 18px; height: 18px; }

  button:focus-visible { outline: 2px solid var(--marca); outline-offset: 2px; }

  /* --- Saltos entre vistas: botón "360" que late --- */
  .salto360 {
    position: relative; width: 58px; height: 58px; border-radius: 50%;
    border: 2.5px solid #fff; padding: 4px; cursor: pointer;
    box-shadow: 0 2px 10px rgba(0,0,0,.35);
    animation: latido 1.6s ease-in-out infinite;
  }
  .salto360 .disco {
    width: 100%; height: 100%; border-radius: 50%;
    background: var(--salto, #b8966b); display: grid; place-items: center;
  }
  .salto360 .disco svg { width: 78%; height: 78%; display: block; }
  .salto360 .onda {
    position: absolute; inset: -3px; border-radius: 50%;
    border: 2px solid rgba(255,255,255,.8); pointer-events: none;
    animation: onda 1.6s ease-out infinite;
  }
  .salto360:hover { animation-play-state: paused; transform: scale(1.1); }
  @keyframes latido {
    0%, 100% { transform: scale(1); }
    15% { transform: scale(1.09); }
    30% { transform: scale(.98); }
    45% { transform: scale(1.05); }
  }
  @keyframes onda {
    0% { transform: scale(1); opacity: .9; }
    100% { transform: scale(1.55); opacity: 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    .salto360, .salto360 .onda { animation: none; }
  }

  /* --- Número de lote siempre visible --- */
  .lote-label {
    min-width: 22px; height: 22px; padding: 0 4px; border-radius: 11px;
    display: flex; align-items: center; justify-content: center;
    color: #fff; font: 600 11px 'Montserrat', Arial, sans-serif;
    border: 1.5px solid rgba(255,255,255,.9); box-shadow: 0 1px 2px rgba(0,0,0,.35);
    pointer-events: none;
  }
  .psv-marker.marcador-numero, .psv-marker.marcador-numero * { pointer-events: none !important; }
  /* Lote bajo el mouse: se ilumina un poco */
  .psv-markers-svg-container .psv-marker--has-tooltip { transition: filter .15s; }
  .psv-markers-svg-container .psv-marker--has-tooltip:hover { filter: brightness(1.45) saturate(1.2); }

  /* --- Cuadrito de detalle del lote (igual al del proyecto de lotes) --- */
  .tooltip-lote .psv-tooltip-content {
    background-color: #fff; color: #000;
    font-family: 'Montserrat', Arial, Helvetica, sans-serif; font-weight: 400;
    -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
    border-radius: 5px; padding: 0; min-width: 190px;
    border: 1px solid #222; box-shadow: none; overflow: hidden;
  }
  .tooltip-lote .psv-tooltip-arrow { display: none; }

  /* Cartelito del botón 360 */
  .psv-tooltip.tooltip-salto { max-width: none; background: rgba(18, 26, 24, .9); border-radius: 8px; }
  .tooltip-salto .psv-tooltip-content {
    color: #fff; padding: 7px 12px; font: 600 13px var(--fuente); white-space: nowrap; text-shadow: none;
  }
  .tooltip-salto .psv-tooltip-arrow { display: none; }
  .detalle-lote { padding: 10px 14px 12px; }
  .detalle-lote-titulo {
    font-size: .85rem; font-weight: 600; letter-spacing: .2px; color: #111;
    margin: 0 0 8px; padding-bottom: 6px; border-bottom: 1px solid #eee;
  }
  .detalle-lote-fila {
    display: flex; justify-content: space-between; align-items: baseline; gap: 16px;
    font-size: .75rem; line-height: 1.5; padding: 1px 0;
  }
  .detalle-lote-fila .valor { font-weight: 600; text-align: right; }
  .estado-disponible { color: var(--disponible); }
  .estado-reservado { color: var(--reservado); }
  .estado-vendido { color: var(--vendido); }
  .estado-no-disponible { color: var(--no-disponible); }

  /* --- Modo editor (agregar ?editar a la URL) --- */
  .editor {
    position: fixed; z-index: 20; right: 14px; top: calc(70px + env(safe-area-inset-top, 0px));
    width: min(340px, calc(100% - 28px)); max-height: calc(100% - 180px); overflow: auto;
    padding: 14px; background: var(--panel-solid); border: 1px solid var(--linea); border-radius: 14px;
    font-size: 13px; line-height: 1.45;
  }
  .editor h3 { margin: 0 0 6px; font-size: 13px; }
  .editor section + section { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--linea); }
  .editor p { margin: 0 0 8px; color: var(--texto-suave); }
  .editor code {
    display: block; padding: 9px 10px; border-radius: 8px; background: #0a0f0e;
    font: 12px/1.4 ui-monospace, Menlo, Consolas, monospace; color: var(--marca);
    user-select: all; word-break: break-all; max-height: 140px; overflow: auto;
  }
  .editor .acciones { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .editor button {
    padding: 8px 12px; border: 0; border-radius: 8px; cursor: pointer;
    background: var(--marca); color: #1b1a10; font: 700 13px var(--fuente);
  }
  .editor button.secundario { background: rgba(255,255,255,.12); color: var(--texto); }
  .editor button[aria-pressed="true"] { background: #fff; }

  @media (max-width: 560px) {
    .titulo strong { font-size: 16px; }
    .leyenda { font-size: 11px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>

<div id="visor"></div>

<div class="titulo vidrio">
  <small>Recorrido virtual</small>
  <strong id="nombre-proyecto">La Amelia</strong>
  <div class="leyenda" aria-label="Referencias">

   A partir de acá no hace falta tocar nada

const ANCHO_REF_POR_DEFECTO = 1920;
const rad = g => g * Math.PI / 180;
const grados = r => { let g = r * 180 / Math.PI; if (g > 180) g -= 360; return g; };

/* Píxel de la foto de referencia → ángulos (yaw, pitch) en radianes, y al revés */
function pixelAAngulo([x, y], ancho) {
  const alto = ancho / 2;
  return [(x / ancho) * 2 * Math.PI - Math.PI, Math.PI / 2 - (y / alto) * Math.PI];
}
function anguloAPixel(yaw, pitch, ancho) {
  let x = ((yaw + Math.PI) / (2 * Math.PI)) * ancho;
  x = ((x % ancho) + ancho) % ancho;
  const y = ((Math.PI / 2 - pitch) / Math.PI) * (ancho / 2);
  return [Math.round(x * 10) / 10, Math.round(y * 10) / 10];
}
/* Tamaño mínimo (en píxeles² de una foto de 6080 px) para mostrar el número del lote */
const AREA_MIN_NUMERO = 2500;
const ANCHO_REF_POR_DEFECTO_AREA = 6080;
function areaPoligono(p) {
  let a = 0;
  for (let i = 0, j = p.length - 1; i < p.length; j = i++) a += (p[j][0] + p[i][0]) * (p[j][1] - p[i][1]);
  return Math.abs(a / 2);
}
function centroide(puntos) {
  const s = puntos.reduce((a, p) => [a[0] + p[0], a[1] + p[1]], [0, 0]);
  return [s[0] / puntos.length, s[1] / puntos.length];
}

/* Si el dispositivo no aguanta fotos de 6080 px de ancho, usa la versión "-lite" (4096 px) */
const TEXTURA_MAX = (() => {
  try {
    const c = document.createElement("canvas");
    const gl = c.getContext("webgl") || c.getContext("experimental-webgl");
    return gl ? gl.getParameter(gl.MAX_TEXTURE_SIZE) : 0;
  } catch (e) { return 0; }
})();
const USAR_LITE = TEXTURA_MAX > 0 && TEXTURA_MAX < 6080;
const rutaFoto = ruta => USAR_LITE ? ruta.replace(/\.jpg$/, "-lite.jpg") : ruta;

/* ---------- Estados y estilos de lotes ---------- */
/* Número de lote: mismo color que el relleno, semitransparente */
const COLOR_BADGE = {
  'Disponible': 'rgba(78,140,88,.85)', 'Reservado': 'rgba(176,140,40,.85)', 'Vendido': 'rgba(168,74,64,.85)',
  'No Disponible': 'rgba(60,60,60,.8)', 'Desarrollador': 'rgba(60,60,60,.8)'
};
const colorBadge = estado => COLOR_BADGE[estado] || 'rgba(40,40,40,.55)';

/* Borde blanco para todos; la disponibilidad se ve en el relleno */
const BORDE_LOTE = 'rgba(255,255,255,0.85)';
const ANCHO_BORDE = '1.5px';

function estiloPorEstado(estado) {
  switch (estado) {
    case 'Disponible': return { fill: 'rgba(111,174,120,0.28)' };
    case 'Reservado':  return { fill: 'rgba(217,183,90,0.30)' };
    case 'Vendido':    return { fill: 'rgba(201,105,95,0.30)' };
    case 'No Disponible':
    case 'Desarrollador': return { fill: 'rgba(30,30,30,0.35)' };
    default: return { fill: 'rgba(255,255,255,0.08)' };   // sin datos de la planilla
  }
}
const textoEstado = e => e === 'Desarrollador' ? 'No Disponible' : e;
function claseEstado(e) {
  return { 'Disponible': 'estado-disponible', 'Reservado': 'estado-reservado', 'Vendido': 'estado-vendido' }[e]
    || 'estado-no-disponible';
}

function tooltipHTML(id, fila) {
  if (!fila) {
    return `<div class="detalle-lote"><div class="detalle-lote-titulo">Lote ${id}</div>
      <div class="detalle-lote-fila"><span>Estado</span><span class="valor">Sin datos</span></div></div>`;
  }
  const [, superficie, estado, , valorLista] = fila;
  let filas = `
    <div class="detalle-lote-fila"><span>Superficie</span><span class="valor">${superficie} m2</span></div>
    <div class="detalle-lote-fila"><span>Estado</span><span class="valor ${claseEstado(estado)}">${textoEstado(estado)}</span></div>`;
  if (estado === 'Disponible') {
    filas += `<div class="detalle-lote-fila"><span>Precio Lista</span><span class="valor">${valorLista}</span></div>`;
  }
  return `<div class="detalle-lote"><div class="detalle-lote-titulo">Lote ${id}</div>${filas}</div>`;
}

/* ---------- Botón de salto: "360°" con flecha circular ---------- */
/* Texto que aparece al pasar el mouse por el botón 360 */
const TEXTO_SALTO = "Ir a la vista 360 desde este punto";

const ICONO_SALTO =
  '<span class="onda"></span>' +
  '<div class="disco"><svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">' +
    '<text x="50" y="52" text-anchor="middle" fill="#fff" ' +
      'style="font: 700 30px Manrope, system-ui, sans-serif; letter-spacing: -.5px">360°</text>' +
    '<path d="M27 58 C12 64 20 76 50 76 C66 76 76 73 81 68" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/>' +
    '<path d="M72 63 L82 68 L73 74" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>' +
  '</svg></div>';
const escaparTexto = t => String(t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

/* ---------- Disponibilidad (planilla) ---------- */
let estadoDatos = 'cargando';          // 'cargando' | 'ok' | 'error'
const DISPONIBILIDAD = {};             // "id" → fila [id, superficie, estado, contado, lista]
const avisoDatos = document.getElementById('estado-datos');

/* ---------- Marcadores de cada vista ---------- */
function marcadoresDe(v) {
  const lista = [];

  (v.puntos || []).forEach((p, i) => {
    if (p.altura) return;   // los de altura van como botón en pantalla
    lista.push({
      id: 'salto-' + i,
      position: { yaw: rad(p.yaw), pitch: rad(p.pitch) },
      html: `<div class="salto360" role="button" aria-label="${escaparTexto(TEXTO_SALTO)}">${ICONO_SALTO}</div>`,
      tooltip: { content: escaparTexto(TEXTO_SALTO), position: 'top center', className: 'tooltip-salto' },
      anchor: 'center center',
      zIndex: 20,
      data: { tipo: 'salto', a: p.a },
    });
  });

  if (estadoDatos === 'cargando') return lista;

  const ancho = v.anchoRef || ANCHO_REF_POR_DEFECTO;
  Object.entries(v.lotes || {}).forEach(([id, puntos]) => {
    const fila = DISPONIBILIDAD[id];
    if (estadoDatos === 'ok' && !fila) return;   // lote que no está en la planilla: no se dibuja
    const estado = fila ? fila[2] : null;
    const estilo = estiloPorEstado(estado);

    lista.push({
      id: 'lote-' + id,
      polygon: puntos.map(p => pixelAAngulo(p, ancho)),
      svgStyle: { fill: estilo.fill, stroke: BORDE_LOTE, strokeWidth: ANCHO_BORDE, strokeLinejoin: 'round' },
      tooltip: { content: tooltipHTML(id, fila), className: 'tooltip-lote', trigger: 'hover' },
      data: { tipo: 'lote', id },
    });

    // En lotes muy lejanos (se ven chiquitos) no se pone el número, para no amontonar
    if (areaPoligono(puntos) * (ANCHO_REF_POR_DEFECTO_AREA / ancho) ** 2 < AREA_MIN_NUMERO) return;

    const [yaw, pitch] = pixelAAngulo(centroide(puntos), ancho);
    lista.push({
      id: 'label-' + id,
      position: { yaw, pitch },
      html: `<div class="lote-label" style="background-color:${colorBadge(estado)}">${escaparTexto(id)}</div>`,
      anchor: 'center center',
      className: 'marcador-numero',
      zIndex: 5,
    });
  });

  return lista;
}

/* Al llegar a una vista sigue mirando hacia el mismo punto cardinal.
   Si alguna de las dos vistas no tiene "rumbo", usa el yaw/pitch inicial del destino. */
function posicionDeLlegada(destino, rumboCamara) {
  const d = VISTAS.find(v => v.id === destino);
  if (rumboCamara == null || d.rumbo == null) return { yaw: rad(d.yaw), pitch: rad(d.pitch) };
  return { yaw: rad(rumboCamara - d.rumbo), pitch: rad(d.pitch) };
}

/* ---------- Visor ---------- */
document.getElementById("nombre-proyecto").textContent = NOMBRE_PROYECTO;
document.title = NOMBRE_PROYECTO + " | Recorrido virtual";

const primera = VISTAS[0];
let vistaActual = primera.id;
let navegando = false;

const visor = new Viewer({
  container: document.getElementById('visor'),
  panorama: rutaFoto(primera.imagen),
  defaultYaw: rad(primera.yaw),
  defaultPitch: rad(primera.pitch),
  defaultZoomLvl: ZOOM_INICIAL,
  navbar: false,
  loadingTxt: 'Cargando…',
  plugins: [[MarkersPlugin, { markers: [], clickEventOnMarker: true }]],
});
const marcadores = visor.getPlugin(MarkersPlugin);

visor.addEventListener('ready', () => marcadores.setMarkers(marcadoresDe(primera)), { once: true });

let loteAbierto = null;
let ultimoToqueLote = 0;
function cerrarDetalle() {
  if (loteAbierto) { try { marcadores.hideMarkerTooltip(loteAbierto); } catch (e) {} }
  loteAbierto = null;
}
marcadores.addEventListener('select-marker', ({ marker }) => {
  if (marker.data?.tipo === 'salto') { cerrarDetalle(); irA(marker.data.a, marker.config.position); return; }
  if (marker.data?.tipo === 'lote') {
    ultimoToqueLote = Date.now();
    if (loteAbierto && loteAbierto !== marker.id) cerrarDetalle();
    loteAbierto = marker.id;
    marcadores.showMarkerTooltip(marker.id);
  }
});
visor.addEventListener('click', () => {
  setTimeout(() => { if (Date.now() - ultimoToqueLote > 250) cerrarDetalle(); }, 0);
});

async function irA(id, haciaSalto = null) {
  if (navegando || id === vistaActual) return;
  const v = VISTAS.find(x => x.id === id);
  const origen = VISTAS.find(x => x.id === vistaActual);
  if (!v) return;
  navegando = true;

  // Punto cardinal hacia donde se mira al saltar (hacia el salto, o hacia donde estaba mirando)
  const yawOrigen = haciaSalto ? haciaSalto.yaw : visor.getPosition().yaw;
  const rumboCamara = origen.rumbo != null ? origen.rumbo + grados(yawOrigen) : null;

  try {
    // Si vino de un salto: gira y se acerca un poco hacia él, como "caminando"
    if (haciaSalto && !matchMedia('(prefers-reduced-motion: reduce)').matches) {
      await visor.animate({ yaw: haciaSalto.yaw, pitch: 0, zoom: Math.min(100, visor.getZoomLevel() + 20), speed: 450 });
    }
    cerrarDetalle();
    marcadores.clearMarkers();
    vistaActual = id;
    marcarActiva();
    await visor.setPanorama(rutaFoto(v.imagen), {
      position: posicionDeLlegada(id, rumboCamara),
      zoom: ZOOM_INICIAL,
      transition: { speed: 900, rotation: false, effect: 'fade' },
    });
    marcadores.setMarkers(marcadoresDe(v));
  } catch (e) {
    console.error('No se pudo abrir la vista', id, e);
  } finally {
    navegando = false;
  }
}

const alturas = document.getElementById("alturas");
const FLECHA_ALTURA = {
  subir: '<path d="M12 19V5M6 11l6-6 6 6"/>',
  bajar: '<path d="M12 5v14M6 13l6 6 6-6"/>'
};
function mostrarAlturas(v) {
  alturas.innerHTML = "";
  (v.puntos || []).filter(p => p.altura).forEach(p => {
    const b = document.createElement("button");
    b.className = "altura vidrio";
    b.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" ' +
      'stroke-linecap="round" stroke-linejoin="round">' + (FLECHA_ALTURA[p.altura] || FLECHA_ALTURA.subir) + '</svg><span></span>';
    b.querySelector("span").textContent = p.texto;
    b.addEventListener("click", () => irA(p.a));
    alturas.appendChild(b);
  });
}

function marcarActiva() {
  const v = VISTAS.find(x => x.id === vistaActual);
  if (v) mostrarAlturas(v);
}
marcarActiva();

/* ---------- Carga de la planilla ---------- */
avisoDatos.textContent = 'Cargando disponibilidad…';
fetch(URL_PLANILLA)
  .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
  .then(data => {
    (data.values || []).forEach(fila => {
      if (fila[0] != null) DISPONIBILIDAD[String(fila[0]).trim()] = fila;
    });
    estadoDatos = 'ok';
    avisoDatos.textContent = '';
  })
  .catch(err => {
    console.error('Error cargando datos de Sheets:', err);
    estadoDatos = 'error';
    avisoDatos.textContent = 'No se pudo cargar la disponibilidad. Los lotes se muestran sin estado.';
  })
  .finally(() => {
    if (!navegando && visor.state.ready) {
      marcadores.setMarkers(marcadoresDe(VISTAS.find(v => v.id === vistaActual)));
    }
  });

      </div>
      <code id="ed-lote" style="margin-top:8px">Sin puntos</code>
      <div class="acciones"><button type="button" data-copiar="ed-lote">Copiar</button></div>
    </section>`;
  document.body.appendChild(panel);

  let dibujando = false;
  let puntosLote = [];   // en radianes [yaw, pitch]
  const anchoVista = () => VISTAS.find(v => v.id === vistaActual).anchoRef || ANCHO_REF_POR_DEFECTO;

  function actualizarLote() {
    try { marcadores.removeMarker('editor-lote'); } catch (e) {}
    if (puntosLote.length >= 2) {
      const forma = puntosLote.length >= 3 ? 'polygon' : 'polyline';
      marcadores.addMarker({
        id: 'editor-lote', [forma]: puntosLote,
        svgStyle: { fill: 'rgba(240,201,74,.3)', stroke: '#f0c94a', strokeWidth: '2px', strokeDasharray: '6 4' },
      });
    }
    const ancho = anchoVista();
    const px = puntosLote.map(([y, p]) => anguloAPixel(y, p, ancho));
    document.getElementById('ed-lote').textContent = px.length
      ? `"ID": ${JSON.stringify(px)},`
      : 'Sin puntos';
  }

  visor.addEventListener('dblclick', ({ data }) => {
    if (dibujando) return;
    document.getElementById("ed-salto").textContent =
      `{ a: "id-destino", yaw: ${grados(data.yaw).toFixed(0)}, pitch: ${grados(data.pitch).toFixed(0)}, texto: "Nombre" },`;
  });
  visor.addEventListener('click', ({ data }) => {
    if (!dibujando || data.rightclick) return;
    puntosLote.push([data.yaw, data.pitch]);
    actualizarLote();
  });

  const btnDibujar = document.getElementById('ed-dibujar');
  btnDibujar.addEventListener('click', () => {
    dibujando = !dibujando;
    btnDibujar.setAttribute('aria-pressed', String(dibujando));
    btnDibujar.textContent = dibujando ? 'Dibujando… (clic para pausar)' : 'Dibujar lote';
  });
  document.getElementById('ed-deshacer').addEventListener('click', () => { puntosLote.pop(); actualizarLote(); });
  document.getElementById('ed-limpiar').addEventListener('click', () => { puntosLote = []; actualizarLote(); });
  panel.querySelectorAll('[data-copiar]').forEach(b => b.addEventListener('click', () => {
    const t = document.getElementById(b.dataset.copiar).textContent;
    if (navigator.clipboard) navigator.clipboard.writeText(t);
  }));

  // Al cambiar de vista se descarta el dibujo en curso
  visor.addEventListener('panorama-load', () => { puntosLote = []; actualizarLote(); });
}
</script>
</body>
</html>
