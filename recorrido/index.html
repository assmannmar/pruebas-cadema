<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Recorrido virtual del loteo</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/pannellum/2.5.6/pannellum.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pannellum/2.5.6/pannellum.js"></script>

<style>
  :root {
    --panel: rgba(18, 26, 24, .66);
    --panel-solid: #121a18;
    --linea: rgba(255, 255, 255, .16);
    --texto: #f3f5ef;
    --texto-suave: rgba(243, 245, 239, .72);
    --marca: #f0c94a;
    --fuente: "Manrope", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #0c1210; font-family: var(--fuente); color: var(--texto); }
  #panorama { position: fixed; inset: 0; }

  /* --- Título --- */
  .titulo {
    position: fixed; z-index: 10;
    top: calc(14px + env(safe-area-inset-top, 0px)); left: 14px;
    max-width: calc(100% - 120px);
    padding: 10px 16px 11px;
    background: var(--panel); border: 1px solid var(--linea); border-radius: 14px;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    pointer-events: none;
  }
  .titulo small { display: block; font-size: 12px; font-weight: 500; color: var(--texto-suave); margin-bottom: 2px; }
  .titulo strong { font-size: 18px; font-weight: 700; letter-spacing: -.01em; }

  /* --- Barra inferior --- */
  .barra {
    position: fixed; z-index: 10; left: 0; right: 0;
    bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    display: flex; justify-content: center; gap: 8px;
    padding: 0 14px; pointer-events: none;
  }
  .barra > * { pointer-events: auto; }
  .flecha {
    flex: none; width: 46px; height: 46px; border-radius: 50%;
    display: grid; place-items: center; cursor: pointer;
    background: var(--panel); border: 1px solid var(--linea); color: var(--texto);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    transition: background .15s;
  }
  .flecha:hover { background: rgba(18, 26, 24, .9); }
  .flecha svg { width: 20px; height: 20px; }

  .vistas {
    display: flex; gap: 6px; padding: 5px; max-width: min(100%, 860px);
    overflow-x: auto; scrollbar-width: none;
    background: var(--panel); border: 1px solid var(--linea); border-radius: 26px;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .vistas::-webkit-scrollbar { display: none; }
  .vista {
    flex: none; display: flex; align-items: center; gap: 9px;
    padding: 4px 16px 4px 4px; border: 0; border-radius: 22px; cursor: pointer;
    background: transparent; color: var(--texto-suave);
    font: 600 14px/1 var(--fuente); white-space: nowrap;
    transition: background .15s, color .15s;
  }
  .vista:hover { background: rgba(255, 255, 255, .09); color: var(--texto); }
  .vista img {
    width: 38px; height: 38px; border-radius: 50%; object-fit: cover;
    background: #26332f; border: 2px solid transparent;
  }
  .vista.activa { background: var(--marca); color: #1b1a10; }
  .vista.activa img { border-color: #1b1a10; }

  /* --- Hotspots: flecha de navegación, estilo Google Maps --- */
  .pnlm-hotspot-base.punto {
    width: 46px; height: 46px;
    cursor: pointer; transition: transform .15s;
    filter: drop-shadow(0 2px 6px rgba(0, 0, 0, .55));
  }
  .pnlm-hotspot-base.punto:hover { transform: scale(1.14); }
  .pnlm-hotspot-base.punto::after {           /* anillo de pulso sutil, marca el punto en el piso */
    content: ""; position: absolute; left: 50%; bottom: -3px; translate: -50% 0;
    width: 20px; height: 8px; border-radius: 50%;
    background: rgba(0, 0, 0, .35); filter: blur(1.5px);
    animation: pulso 2.4s ease-out infinite;
  }
  @keyframes pulso { from { opacity: .5; } 50% { opacity: .15; } to { opacity: .5; } }
  .punto svg { position: absolute; inset: 0; margin: auto; width: 46px; height: 46px; }

  /* --- Modo editor (agregar ?editar a la URL) --- */
  .editor {
    position: fixed; z-index: 20; right: 14px; top: calc(14px + env(safe-area-inset-top, 0px));
    width: min(340px, calc(100% - 28px)); padding: 14px;
    background: var(--panel-solid); border: 1px solid var(--linea); border-radius: 14px;
    font-size: 13px; line-height: 1.45;
  }
  .editor p { margin: 0 0 8px; color: var(--texto-suave); }
  .editor code {
    display: block; padding: 9px 10px; border-radius: 8px; background: #0a0f0e;
    font: 12px/1.4 ui-monospace, Menlo, Consolas, monospace; color: var(--marca);
    user-select: all; word-break: break-all;
  }
  .editor button {
    margin-top: 8px; padding: 8px 12px; border: 0; border-radius: 8px; cursor: pointer;
    background: var(--marca); color: #1b1a10; font: 700 13px var(--fuente);
  }

  .barra .flecha:focus-visible, .vista:focus-visible { outline: 2px solid var(--marca); outline-offset: 2px; }
  @media (max-width: 560px) {
    .vista span { display: none; }
    .vista { padding: 4px; }
    .titulo strong { font-size: 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .punto::after { animation: none; }
    * { transition: none !important; }
  }
</style>
</head>
<body>

<div id="panorama"></div>

<div class="titulo">
  <small id="nombre-proyecto">Recorrido virtual</small>
  <strong id="nombre-vista"></strong>
</div>

<div class="barra">
  <button class="flecha" id="anterior" aria-label="Vista anterior">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
  </button>
  <nav class="vistas" id="menu" aria-label="Puntos de vista"></nav>
  <button class="flecha" id="siguiente" aria-label="Vista siguiente">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
  </button>
</div>

<script>
/* =====================================================================
   CONFIGURACIÓN — es lo único que hace falta editar
   ===================================================================== */

const NOMBRE_PROYECTO = "Recorrido virtual del loteo";

/*  Cada vista:
      id        nombre interno, sin espacios ni tildes
      titulo    lo que ve la persona (cambialo por el nombre real de cada punto)
      imagen    foto 360 (equirectangular 2:1)
      miniatura foto chica para el menú
      yaw       hacia dónde mira al abrir (-180 a 180, 0 = centro de la foto)
      puntos    saltos hacia otras vistas: { a: "id-destino", yaw, pitch, texto }

    Para ajustar la posición de un punto: abrí el recorrido con
    index.html?editar  y hacé doble clic donde lo quieras. Te da yaw y pitch.
*/
const VISTAS = [
  { id: "p1", titulo: "Entrada", imagen: "fotos/p1.jpg", miniatura: "fotos/p1-min.jpg",
    yaw: -70, pitch: -5, hfov: 90,
    puntos: [ { a: "p2", yaw: -105, pitch: -8, texto: "Punto 2" } ] },

  { id: "p2", titulo: "Punto 2", imagen: "fotos/p2.jpg", miniatura: "fotos/p2-min.jpg",
    yaw: -107, pitch: -5, hfov: 90,
    puntos: [ { a: "p1", yaw: 69,   pitch: -8, texto: "Entrada" },
              { a: "p3", yaw: -107, pitch: -8, texto: "Punto 3" } ] },

  { id: "p3", titulo: "Punto 3", imagen: "fotos/p3.jpg", miniatura: "fotos/p3-min.jpg",
    yaw: -107, pitch: -5, hfov: 90,
    puntos: [ { a: "p2", yaw: 69,   pitch: -8, texto: "Punto 2" },
              { a: "p4", yaw: -107, pitch: -8, texto: "Punto 4" } ] },

  { id: "p4", titulo: "Punto 4", imagen: "fotos/p4.jpg", miniatura: "fotos/p4-min.jpg",
    yaw: -130, pitch: -5, hfov: 90,
    puntos: [ { a: "p3", yaw: 52,   pitch: -8, texto: "Punto 3" },
              { a: "p5", yaw: -130, pitch: -8, texto: "Punto 5" } ] },

  { id: "p5", titulo: "Punto 5", imagen: "fotos/p5.jpg", miniatura: "fotos/p5-min.jpg",
    yaw: -114, pitch: -5, hfov: 90,
    puntos: [ { a: "p4", yaw: 66,   pitch: -8, texto: "Punto 4" },
              { a: "p6", yaw: -114, pitch: -8, texto: "Punto 6" } ] },

  { id: "p6", titulo: "Punto 6", imagen: "fotos/p6.jpg", miniatura: "fotos/p6-min.jpg",
    yaw: -131, pitch: -5, hfov: 90,
    puntos: [ { a: "p5", yaw: 58,   pitch: -8, texto: "Punto 5" },
              { a: "p7", yaw: -131, pitch: -8, texto: "Punto 7" } ] },

  { id: "p7", titulo: "Punto 7", imagen: "fotos/p7.jpg", miniatura: "fotos/p7-min.jpg",
    yaw: -134, pitch: -5, hfov: 90,
    puntos: [ { a: "p6", yaw: 65,   pitch: -8, texto: "Punto 6" },
              { a: "p8", yaw: -134, pitch: -8, texto: "Punto 8" } ] },

  { id: "p8", titulo: "Punto 8", imagen: "fotos/p8.jpg", miniatura: "fotos/p8-min.jpg",
    yaw: 110, pitch: -5, hfov: 90,
    puntos: [ { a: "p7", yaw: 9, pitch: -8, texto: "Punto 7" } ] }
];

/* =====================================================================
   A partir de acá no hace falta tocar nada
   ===================================================================== */

/* Flecha chevron tipo Google Maps: círculo celeste con borde blanco y flecha hacia arriba */
const ICONO_SALTO =
  '<svg viewBox="0 0 46 46" xmlns="http://www.w3.org/2000/svg">' +
    '<circle cx="23" cy="23" r="19" fill="#4285F4" stroke="#fff" stroke-width="3"/>' +
    '<path d="M23 14l9 12.5h-6V33h-6v-6.5h-6z" fill="#fff"/>' +
  '</svg>';

document.getElementById("nombre-proyecto").textContent = NOMBRE_PROYECTO;
document.title = NOMBRE_PROYECTO;

function crearPunto(div, args) {
  div.classList.add("punto");
  div.setAttribute("role", "button");
  div.setAttribute("aria-label", "Ir a " + args.texto);   // solo para lectores de pantalla, no se ve
  div.innerHTML = ICONO_SALTO;
}

/* Al llegar a una vista, mira hacia el otro punto de salto (el que sigue el camino) */
function yawDeLlegada(destino, origen) {
  const d = VISTAS.find(v => v.id === destino);
  const otro = (d.puntos || []).find(p => p.a !== origen);
  return otro ? otro.yaw : d.yaw;
}

/* Si el dispositivo no aguanta imágenes de 6080 px de ancho, usa la versión "-lite" (4096 px) */
const TEXTURA_MAX = (() => {
  try {
    const c = document.createElement("canvas");
    const gl = c.getContext("webgl") || c.getContext("experimental-webgl");
    return gl ? gl.getParameter(gl.MAX_TEXTURE_SIZE) : 0;
  } catch (e) { return 0; }
})();
const USAR_LITE = TEXTURA_MAX > 0 && TEXTURA_MAX < 6080;
const rutaFoto = ruta => USAR_LITE ? ruta.replace(/\.jpg$/, "-lite.jpg") : ruta;

const escenas = {};
VISTAS.forEach(v => {
  escenas[v.id] = {
    title: v.titulo,
    type: "equirectangular",
    panorama: rutaFoto(v.imagen),
    yaw: v.yaw, pitch: v.pitch, hfov: v.hfov,
    hotSpots: (v.puntos || []).map(p => ({
      type: "scene", sceneId: p.a, pitch: p.pitch, yaw: p.yaw, text: p.texto,
      targetYaw: yawDeLlegada(p.a, v.id), targetPitch: -5, targetHfov: 90,
      cssClass: "punto", createTooltipFunc: crearPunto, createTooltipArgs: { texto: p.texto }
    }))
  };
});

const visor = pannellum.viewer("panorama", {
  default: {
    firstScene: VISTAS[0].id,
    sceneFadeDuration: 900,
    autoLoad: true,
    showControls: true,
    compass: false,
    minHfov: 50, maxHfov: 120,
    minPitch: -40, maxPitch: 60,
    strings: { loadButtonLabel: "Tocá para cargar", loadingLabel: "Cargando…", bylineLabel: "" }
  },
  scenes: escenas
});

/* --- Menú de vistas --- */
const menu = document.getElementById("menu");
VISTAS.forEach(v => {
  const b = document.createElement("button");
  b.className = "vista";
  b.dataset.id = v.id;
  b.innerHTML = '<img alt="" loading="lazy"><span></span>';
  b.querySelector("img").src = v.miniatura || v.imagen;
  b.querySelector("span").textContent = v.titulo;
  b.setAttribute("aria-label", v.titulo);
  b.addEventListener("click", () => irA(v.id));
  menu.appendChild(b);
});

function irA(id) {
  if (id === visor.getScene()) return;
  visor.loadScene(id);
}

function indiceActual() { return VISTAS.findIndex(v => v.id === visor.getScene()); }
document.getElementById("anterior").addEventListener("click", () => {
  irA(VISTAS[(indiceActual() - 1 + VISTAS.length) % VISTAS.length].id);
});
document.getElementById("siguiente").addEventListener("click", () => {
  irA(VISTAS[(indiceActual() + 1) % VISTAS.length].id);
});

function marcarActiva() {
  const id = visor.getScene();
  const v = VISTAS.find(x => x.id === id);
  document.getElementById("nombre-vista").textContent = v ? v.titulo : "";
  menu.querySelectorAll(".vista").forEach(b => {
    const activa = b.dataset.id === id;
    b.classList.toggle("activa", activa);
    if (activa) b.scrollIntoView({ block: "nearest", inline: "center", behavior: "smooth" });
  });
}
visor.on("scenechange", marcarActiva);
visor.on("load", marcarActiva);
marcarActiva();

/* Teclado: flechas izquierda/derecha cambian de vista con Shift */
document.addEventListener("keydown", e => {
  if (!e.shiftKey) return;
  if (e.key === "ArrowRight") document.getElementById("siguiente").click();
  if (e.key === "ArrowLeft") document.getElementById("anterior").click();
});

/* --- Modo editor: index.html?editar --- */
if (new URLSearchParams(location.search).has("editar")) {
  const panel = document.createElement("div");
  panel.className = "editor";
  panel.innerHTML =
    '<p><b>Modo editor.</b> Hacé doble clic en la foto donde quieras un punto de salto. ' +
    'Copiá la línea y pegala en <i>puntos</i> de esa vista (cambiá <i>id-destino</i> y el texto).</p>' +
    '<code id="ed-salida">Todavía no hiciste clic</code>' +
    '<button id="ed-copiar" type="button">Copiar</button>';
  document.body.appendChild(panel);

  visor.getContainer().addEventListener("dblclick", e => {
    const [pitch, yaw] = visor.mouseEventToCoords(e);
    document.getElementById("ed-salida").textContent =
      '{ a: "id-destino", yaw: ' + yaw.toFixed(0) + ', pitch: ' + pitch.toFixed(0) + ', texto: "Nombre" },';
  });
  document.getElementById("ed-copiar").addEventListener("click", () => {
    const t = document.getElementById("ed-salida").textContent;
    if (navigator.clipboard) navigator.clipboard.writeText(t);
  });
}
</script>
</body>
</html>
