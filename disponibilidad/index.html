<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Recorrido virtual del loteo</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/core@5.15.1/index.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/markers-plugin@5.15.1/index.min.css">

<style>
  :root {
    --panel: rgba(18, 26, 24, .66);
    --panel-solid: #121a18;
    --linea: rgba(255, 255, 255, .16);
    --texto: #f3f5ef;
    --texto-suave: rgba(243, 245, 239, .72);
    --marca: #f0c94a;
    --fuente: "Manrope", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;

    --disponible: #4a8f3c;
    --reservado: #b8920a;
    --vendido: #c0392b;
    --no-disponible: #555;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #0c1210; font-family: var(--fuente); color: var(--texto); overflow: hidden; }
  #visor { position: fixed; inset: 0; }

  .vidrio {
    background: var(--panel); border: 1px solid var(--linea);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }

  /* --- Título + leyenda --- */
  .titulo {
    position: fixed; z-index: 10;
    top: calc(14px + env(safe-area-inset-top, 0px)); left: 14px;
    max-width: calc(100% - 90px);
    padding: 10px 16px 11px; border-radius: 14px;
    pointer-events: none;
  }
  .titulo small { display: block; font-size: 12px; font-weight: 500; color: var(--texto-suave); margin-bottom: 2px; }
  .titulo strong { display: block; font-size: 18px; font-weight: 700; letter-spacing: -.01em; }
  .leyenda {
    display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 8px; padding-top: 8px;
    border-top: 1px solid var(--linea);
    font-size: 12px; font-weight: 600; color: var(--texto-suave);
  }
  .leyenda span { display: inline-flex; align-items: center; gap: 5px; }
  .leyenda i { width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid #fff; }
  .estado-datos { margin-top: 6px; font-size: 12px; color: var(--marca); }
  .estado-datos:empty { display: none; }

  /* --- Pantalla completa --- */
  .btn-redondo {
    width: 46px; height: 46px; border-radius: 50%;
    display: grid; place-items: center; cursor: pointer; color: var(--texto);
    transition: background .15s;
  }
  .btn-redondo:hover { background: rgba(18, 26, 24, .9); }
  .btn-redondo svg { width: 20px; height: 20px; }
  #pantalla-completa {
    position: fixed; z-index: 10;
    top: calc(14px + env(safe-area-inset-top, 0px)); right: 14px;
  }

  /* --- Barra inferior de vistas --- */
  .barra {
    position: fixed; z-index: 10; left: 0; right: 0;
    bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    display: flex; justify-content: center; gap: 8px;
    padding: 0 14px; pointer-events: none;
  }
  .barra > * { pointer-events: auto; }
  .barra .btn-redondo { flex: none; }
  .vistas {
    display: flex; gap: 6px; padding: 5px; max-width: min(100%, 860px);
    overflow-x: auto; scrollbar-width: none; border-radius: 26px;
  }
  .vistas::-webkit-scrollbar { display: none; }
  .vista {
    flex: none; display: flex; align-items: center; gap: 9px;
    padding: 4px 16px 4px 4px; border: 0; border-radius: 22px; cursor: pointer;
    background: transparent; color: var(--texto-suave);
    font: 600 14px/1 var(--fuente); white-space: nowrap;
    transition: background .15s, color .15s;
  }
  .vista:hover { background: rgba(255, 255, 255, .09); color: var(--texto); }
  .vista img {
    width: 38px; height: 38px; border-radius: 50%; object-fit: cover;
    background: #26332f; border: 2px solid transparent;
  }
  .vista.activa { background: var(--marca); color: #1b1a10; }
  .vista.activa img { border-color: #1b1a10; }

  button:focus-visible { outline: 2px solid var(--marca); outline-offset: 2px; }

  /* --- Saltos entre vistas: óvalo translúcido estilo Street View --- */
  .salto { width: 108px; height: 62px; cursor: pointer; transition: transform .15s; }
  .salto:hover { transform: scale(1.08); }
  .salto svg { display: block; width: 100%; height: 100%; }

  /* --- Número de lote siempre visible --- */
  .lote-label {
    width: 26px; height: 26px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    color: #fff; font: 600 12px 'Montserrat', Arial, sans-serif;
    border: 2px solid #fff; box-shadow: 0 1px 3px rgba(0,0,0,.5);
    pointer-events: none;
  }

  /* --- Cuadrito de detalle del lote (igual al del proyecto de lotes) --- */
  .tooltip-lote .psv-tooltip-content {
    background-color: #fff; color: #000;
    font-family: 'Montserrat', Arial, Helvetica, sans-serif; font-weight: 400;
    -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
    border-radius: 5px; padding: 0; min-width: 190px;
    border: 1px solid #222; box-shadow: none; overflow: hidden;
  }
  .tooltip-lote .psv-tooltip-arrow {
    border-top-color: #fff !important; border-bottom-color: #fff !important;
    border-left-color: #fff !important; border-right-color: #fff !important;
  }
  .detalle-lote { padding: 10px 14px 12px; }
  .detalle-lote-titulo {
    font-size: .85rem; font-weight: 600; letter-spacing: .2px; color: #111;
    margin: 0 0 8px; padding-bottom: 6px; border-bottom: 1px solid #eee;
  }
  .detalle-lote-fila {
    display: flex; justify-content: space-between; align-items: baseline; gap: 16px;
    font-size: .75rem; line-height: 1.5; padding: 1px 0;
  }
  .detalle-lote-fila .valor { font-weight: 600; text-align: right; }
  .estado-disponible { color: var(--disponible); }
  .estado-reservado { color: var(--reservado); }
  .estado-vendido { color: var(--vendido); }
  .estado-no-disponible { color: var(--no-disponible); }

  /* --- Modo editor (agregar ?editar a la URL) --- */
  .editor {
    position: fixed; z-index: 20; right: 14px; top: calc(70px + env(safe-area-inset-top, 0px));
    width: min(340px, calc(100% - 28px)); max-height: calc(100% - 180px); overflow: auto;
    padding: 14px; background: var(--panel-solid); border: 1px solid var(--linea); border-radius: 14px;
    font-size: 13px; line-height: 1.45;
  }
  .editor h3 { margin: 0 0 6px; font-size: 13px; }
  .editor section + section { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--linea); }
  .editor p { margin: 0 0 8px; color: var(--texto-suave); }
  .editor code {
    display: block; padding: 9px 10px; border-radius: 8px; background: #0a0f0e;
    font: 12px/1.4 ui-monospace, Menlo, Consolas, monospace; color: var(--marca);
    user-select: all; word-break: break-all; max-height: 140px; overflow: auto;
  }
  .editor .acciones { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .editor button {
    padding: 8px 12px; border: 0; border-radius: 8px; cursor: pointer;
    background: var(--marca); color: #1b1a10; font: 700 13px var(--fuente);
  }
  .editor button.secundario { background: rgba(255,255,255,.12); color: var(--texto); }
  .editor button[aria-pressed="true"] { background: #fff; }

  @media (max-width: 560px) {
    .vista span { display: none; }
    .vista { padding: 4px; }
    .titulo strong { font-size: 16px; }
    .leyenda { font-size: 11px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>

<div id="visor"></div>

<div class="titulo vidrio">
  <small id="nombre-proyecto">Recorrido virtual</small>
  <strong id="nombre-vista"></strong>
  <div class="leyenda" aria-label="Referencias">
    <span><i style="background:var(--disponible)"></i>Disponible</span>
    <span><i style="background:var(--reservado)"></i>Reservado</span>
    <span><i style="background:var(--vendido)"></i>Vendido</span>
    <span><i style="background:var(--no-disponible)"></i>No disponible</span>
  </div>
  <div class="estado-datos" id="estado-datos"></div>
</div>

<button class="btn-redondo vidrio" id="pantalla-completa" aria-label="Pantalla completa">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
</button>

<div class="barra">
  <button class="btn-redondo vidrio" id="anterior" aria-label="Vista anterior">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
  </button>
  <nav class="vistas vidrio" id="menu" aria-label="Puntos de vista"></nav>
  <button class="btn-redondo vidrio" id="siguiente" aria-label="Vista siguiente">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
  </button>
</div>

const ANCHO_REF_POR_DEFECTO = 1920;
const rad = g => g * Math.PI / 180;
const grados = r => { let g = r * 180 / Math.PI; if (g > 180) g -= 360; return g; };

/* Píxel de la foto de referencia → ángulos (yaw, pitch) en radianes, y al revés */
function pixelAAngulo([x, y], ancho) {
  const alto = ancho / 2;
  return [(x / ancho) * 2 * Math.PI - Math.PI, Math.PI / 2 - (y / alto) * Math.PI];
}
function anguloAPixel(yaw, pitch, ancho) {
  let x = ((yaw + Math.PI) / (2 * Math.PI)) * ancho;
  x = ((x % ancho) + ancho) % ancho;
  const y = ((Math.PI / 2 - pitch) / Math.PI) * (ancho / 2);
  return [Math.round(x * 10) / 10, Math.round(y * 10) / 10];
}
function centroide(puntos) {
  const s = puntos.reduce((a, p) => [a[0] + p[0], a[1] + p[1]], [0, 0]);
  return [s[0] / puntos.length, s[1] / puntos.length];
}

/* Si el dispositivo no aguanta fotos de 6080 px de ancho, usa la versión "-lite" (4096 px) */
const TEXTURA_MAX = (() => {
  try {
    const c = document.createElement("canvas");
    const gl = c.getContext("webgl") || c.getContext("experimental-webgl");
    return gl ? gl.getParameter(gl.MAX_TEXTURE_SIZE) : 0;
  } catch (e) { return 0; }
})();
const USAR_LITE = TEXTURA_MAX > 0 && TEXTURA_MAX < 6080;
const rutaFoto = ruta => USAR_LITE ? ruta.replace(/\.jpg$/, "-lite.jpg") : ruta;

/* ---------- Estados y estilos de lotes ---------- */
const COLOR_BADGE = { 'Disponible': '#4a8f3c', 'Reservado': '#b8920a', 'Vendido': '#c0392b' };
const colorBadge = estado => COLOR_BADGE[estado] || '#555';

function estiloPorEstado(estado) {
  switch (estado) {
    case 'Disponible': return { fill: 'rgba(95,156,87,0.35)', stroke: 'rgba(95,156,87,0.9)' };
    case 'Reservado':  return { fill: 'rgba(255,255,0,0.5)',  stroke: 'rgba(200,200,0,0.9)' };
    case 'Vendido':    return { fill: 'rgba(255,0,0,0.5)',    stroke: 'rgba(200,0,0,0.9)' };
    case 'No Disponible':
    case 'Desarrollador': return { fill: 'rgba(0,0,0,0.5)', stroke: 'rgba(0,0,0,0.9)' };
    default: return { fill: 'rgba(150,150,150,0.4)', stroke: 'rgba(150,150,150,0.9)' };
  }
}
const textoEstado = e => e === 'Desarrollador' ? 'No Disponible' : e;
function claseEstado(e) {
  return { 'Disponible': 'estado-disponible', 'Reservado': 'estado-reservado', 'Vendido': 'estado-vendido' }[e]
    || 'estado-no-disponible';
}

function tooltipHTML(id, fila) {
  if (!fila) {
    return `<div class="detalle-lote"><div class="detalle-lote-titulo">Lote ${id}</div>
      <div class="detalle-lote-fila"><span>Estado</span><span class="valor">Sin datos</span></div></div>`;
  }
  const [, superficie, estado, , valorLista] = fila;
  let filas = `
    <div class="detalle-lote-fila"><span>Superficie</span><span class="valor">${superficie} m2</span></div>
    <div class="detalle-lote-fila"><span>Estado</span><span class="valor ${claseEstado(estado)}">${textoEstado(estado)}</span></div>`;
  if (estado === 'Disponible') {
    filas += `<div class="detalle-lote-fila"><span>Precio Lista</span><span class="valor">${valorLista}</span></div>`;
  }
  return `<div class="detalle-lote"><div class="detalle-lote-titulo">Lote ${id}</div>${filas}</div>`;
}

/* ---------- Ícono de salto (óvalo con chevron) ---------- */
const ICONO_SALTO =
  '<svg viewBox="0 0 190 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">' +
    '<defs><radialGradient id="ovaloPunto" cx="50%" cy="50%" r="50%">' +
      '<stop offset="55%" stop-color="#e8e8e8" stop-opacity=".55"/>' +
      '<stop offset="100%" stop-color="#e8e8e8" stop-opacity="0"/>' +
    '</radialGradient></defs>' +
    '<ellipse cx="95" cy="50" rx="92" ry="48" fill="url(#ovaloPunto)"/>' +
    '<path d="M55 66 L95 34 L135 66" fill="none" stroke="#6b6b6b" stroke-opacity=".8" ' +
      'stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>' +
  '</svg>';
const escaparTexto = t => String(t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

/* ---------- Disponibilidad (planilla) ---------- */
let estadoDatos = 'cargando';          // 'cargando' | 'ok' | 'error'
const DISPONIBILIDAD = {};             // "id" → fila [id, superficie, estado, contado, lista]
const avisoDatos = document.getElementById('estado-datos');

/* ---------- Marcadores de cada vista ---------- */
function marcadoresDe(v) {
  const lista = [];

  (v.puntos || []).forEach((p, i) => {
    lista.push({
      id: 'salto-' + i,
      position: { yaw: rad(p.yaw), pitch: rad(p.pitch) },
      html: `<div class="salto" role="button" aria-label="Ir a ${escaparTexto(p.texto)}">${ICONO_SALTO}</div>`,
      anchor: 'center center',
      zIndex: 20,
      data: { tipo: 'salto', a: p.a },
    });
  });

  if (estadoDatos === 'cargando') return lista;

  const ancho = v.anchoRef || ANCHO_REF_POR_DEFECTO;
  Object.entries(v.lotes || {}).forEach(([id, puntos]) => {
    const fila = DISPONIBILIDAD[id];
    if (estadoDatos === 'ok' && !fila) return;   // lote que no está en la planilla: no se dibuja
    const estado = fila ? fila[2] : null;
    const estilo = estiloPorEstado(estado);

    lista.push({
      id: 'lote-' + id,
      polygon: puntos.map(p => pixelAAngulo(p, ancho)),
      svgStyle: { fill: estilo.fill, stroke: estilo.stroke, strokeWidth: '2px' },
      tooltip: { content: tooltipHTML(id, fila), className: 'tooltip-lote', trigger: 'hover' },
      data: { tipo: 'lote', id },
    });

    const [yaw, pitch] = pixelAAngulo(centroide(puntos), ancho);
    lista.push({
      id: 'label-' + id,
      position: { yaw, pitch },
      html: `<div class="lote-label" style="background-color:${colorBadge(estado)}">${escaparTexto(id)}</div>`,
      anchor: 'center center',
      zIndex: 5,
    });
  });

  return lista;
}

/* Al llegar a una vista, mira hacia el otro punto de salto (el que sigue el camino) */
function posicionDeLlegada(destino, origen) {
  const d = VISTAS.find(v => v.id === destino);
  const otro = origen ? (d.puntos || []).find(p => p.a !== origen) : null;
  return otro ? { yaw: rad(otro.yaw), pitch: rad(-5) } : { yaw: rad(d.yaw), pitch: rad(d.pitch) };
}

/* ---------- Visor ---------- */
document.getElementById("nombre-proyecto").textContent = NOMBRE_PROYECTO;
document.title = NOMBRE_PROYECTO;

const primera = VISTAS[0];
let vistaActual = primera.id;
let navegando = false;

const visor = new Viewer({
  container: document.getElementById('visor'),
  panorama: rutaFoto(primera.imagen),
  defaultYaw: rad(primera.yaw),
  defaultPitch: rad(primera.pitch),
  defaultZoomLvl: ZOOM_INICIAL,
  navbar: false,
  loadingTxt: 'Cargando…',
  plugins: [[MarkersPlugin, { markers: [], clickEventOnMarker: true }]],
});
const marcadores = visor.getPlugin(MarkersPlugin);

visor.addEventListener('ready', () => marcadores.setMarkers(marcadoresDe(primera)), { once: true });

marcadores.addEventListener('select-marker', ({ marker }) => {
  if (marker.data?.tipo === 'salto') irA(marker.data.a, vistaActual, marker.config.position);
});

async function irA(id, origen = null, haciaSalto = null) {
  if (navegando || id === vistaActual) return;
  const v = VISTAS.find(x => x.id === id);
  if (!v) return;
  navegando = true;

  try {
    // Si vino de un salto: gira y se acerca un poco hacia él, como "caminando"
    if (haciaSalto && !matchMedia('(prefers-reduced-motion: reduce)').matches) {
      await visor.animate({ yaw: haciaSalto.yaw, pitch: 0, zoom: Math.min(100, visor.getZoomLevel() + 20), speed: 450 });
    }
    marcadores.clearMarkers();
    vistaActual = id;
    marcarActiva();
    await visor.setPanorama(rutaFoto(v.imagen), {
      position: posicionDeLlegada(id, origen),
      zoom: ZOOM_INICIAL,
      transition: { speed: 900, rotation: false, effect: 'fade' },
    });
    marcadores.setMarkers(marcadoresDe(v));
  } catch (e) {
    console.error('No se pudo abrir la vista', id, e);
  } finally {
    navegando = false;
  }
}

/* ---------- Menú de vistas ---------- */
const menu = document.getElementById("menu");
VISTAS.forEach(v => {
  const b = document.createElement("button");
  b.className = "vista";
  b.dataset.id = v.id;
  b.innerHTML = '<img alt="" loading="lazy"><span></span>';
  b.querySelector("img").src = v.miniatura || v.imagen;
  b.querySelector("span").textContent = v.titulo;
  b.setAttribute("aria-label", v.titulo);
  b.addEventListener("click", () => irA(v.id));
  menu.appendChild(b);
});

function marcarActiva() {
  const v = VISTAS.find(x => x.id === vistaActual);
  document.getElementById("nombre-vista").textContent = v ? v.titulo : "";
  menu.querySelectorAll(".vista").forEach(b => {
    const activa = b.dataset.id === vistaActual;
    b.classList.toggle("activa", activa);
    b.setAttribute("aria-current", activa ? "true" : "false");
    if (activa) b.scrollIntoView({ block: "nearest", inline: "center", behavior: "smooth" });
  });
}
marcarActiva();

const indiceActual = () => VISTAS.findIndex(v => v.id === vistaActual);
document.getElementById("anterior").addEventListener("click", () =>
  irA(VISTAS[(indiceActual() - 1 + VISTAS.length) % VISTAS.length].id));
document.getElementById("siguiente").addEventListener("click", () =>
  irA(VISTAS[(indiceActual() + 1) % VISTAS.length].id));
document.getElementById("pantalla-completa").addEventListener("click", () => visor.toggleFullscreen());

/* Shift + flechas izquierda/derecha cambian de vista */
document.addEventListener("keydown", e => {
  if (!e.shiftKey) return;
  if (e.key === "ArrowRight") document.getElementById("siguiente").click();
  if (e.key === "ArrowLeft") document.getElementById("anterior").click();
});

/* ---------- Carga de la planilla ---------- */
avisoDatos.textContent = 'Cargando disponibilidad…';
fetch(URL_PLANILLA)
  .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
  .then(data => {
    (data.values || []).forEach(fila => {
      if (fila[0] != null) DISPONIBILIDAD[String(fila[0]).trim()] = fila;
    });
    estadoDatos = 'ok';
    avisoDatos.textContent = '';
  })
  .catch(err => {
    console.error('Error cargando datos de Sheets:', err);
    estadoDatos = 'error';
    avisoDatos.textContent = 'No se pudo cargar la disponibilidad. Los lotes se muestran sin estado.';
  })
  .finally(() => {
    if (!navegando && visor.state.ready) {
      marcadores.setMarkers(marcadoresDe(VISTAS.find(v => v.id === vistaActual)));
    }
  });

    if (dibujando) return;
    document.getElementById("ed-salto").textContent =
      `{ a: "id-destino", yaw: ${grados(data.yaw).toFixed(0)}, pitch: ${grados(data.pitch).toFixed(0)}, texto: "Nombre" },`;
  });
  visor.addEventListener('click', ({ data }) => {
    if (!dibujando || data.rightclick) return;
    puntosLote.push([data.yaw, data.pitch]);
    actualizarLote();
  });

  const btnDibujar = document.getElementById('ed-dibujar');
  btnDibujar.addEventListener('click', () => {
    dibujando = !dibujando;
    btnDibujar.setAttribute('aria-pressed', String(dibujando));
    btnDibujar.textContent = dibujando ? 'Dibujando… (clic para pausar)' : 'Dibujar lote';
  });
  document.getElementById('ed-deshacer').addEventListener('click', () => { puntosLote.pop(); actualizarLote(); });
  document.getElementById('ed-limpiar').addEventListener('click', () => { puntosLote = []; actualizarLote(); });
  panel.querySelectorAll('[data-copiar]').forEach(b => b.addEventListener('click', () => {
    const t = document.getElementById(b.dataset.copiar).textContent;
    if (navigator.clipboard) navigator.clipboard.writeText(t);
  }));

  // Al cambiar de vista se descarta el dibujo en curso
  visor.addEventListener('panorama-load', () => { puntosLote = []; actualizarLote(); });
}
</script>
</body>
</html>
