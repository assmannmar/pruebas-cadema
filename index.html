/* =========================================================================
   2) USE UNA KEY PROPIA
   ========================================================================= */
const requestURL = 'https://sheets.googleapis.com/v4/spreadsheets/1EY4qfcYKgItLwEhLlCJTGxG-o5SdWoE_edjhvq11R1c/values/Lotes!A:E?key=AIzaSyCtphtCkdB2jxj6rmBUM4zTwuXB2TXPGHg';

/* Mismos estados y colores que el SVG original */
// Punto central aproximado de un poligono (promedio de sus vertices),
// usado para ubicar el numero de lote siempre visible.
function centroide(puntos) {
  const n = puntos.length;
  const suma = puntos.reduce((acc, p) => [acc[0] + p[0], acc[1] + p[1]], [0, 0]);
  return { x: suma[0] / n, y: suma[1] / n };
}

// Color solido de fondo del circulo con el numero de lote
function colorBadgePorEstado(estado) {
  switch (estado) {
    case 'Disponible': return '#4a8f3c';
    case 'Reservado': return '#b8920a';
    case 'Vendido': return '#c0392b';
    default: return '#555'; // No Disponible / Desarrollador
  }
}

function estiloPorEstado(estado) {
  switch (estado) {
    case 'Disponible':
      return { fill: 'rgba(95,156,87,0.35)', stroke: 'rgba(95,156,87,0.9)' };
    case 'Reservado':
      return { fill: 'rgba(255,255,0,0.5)', stroke: 'rgba(200,200,0,0.9)' };
    case 'Vendido':
      return { fill: 'rgba(255,0,0,0.5)', stroke: 'rgba(200,0,0,0.9)' };
    case 'No Disponible':
    case 'Desarrollador':
      return { fill: 'rgba(0,0,0,0.5)', stroke: 'rgba(0,0,0,0.9)' };
    default:
      return { fill: 'rgba(150,150,150,0.4)', stroke: 'rgba(150,150,150,0.9)' };
  }
}

// Texto que se muestra en el tooltip para cada estado.
// "Desarrollador" se muestra al publico como "No Disponible" (el color ya es el mismo).
function textoEstado(estado) {
  if (estado === 'Desarrollador') return 'No Disponible';
  return estado;
}

// Clase de color para el texto del estado dentro del tooltip
function claseEstado(estado) {
  switch (estado) {
    case 'Disponible': return 'estado-disponible';
    case 'Reservado': return 'estado-reservado';
    case 'Vendido': return 'estado-vendido';
    default: return 'estado-no-disponible'; // No Disponible / Desarrollador
  }
}

function tooltipHTML(lote) {
  // lote = [id, superficie, estado, valorContado, valorLista]  (mismas columnas A:E)
  const [id, superficie, estado, valorContado, valorLista] = lote;
  const estadoTexto = textoEstado(estado);
  const claseEst = claseEstado(estado);

  let filas = `
    <div class="detalle-lote-fila"><span>Superficie</span><span class="valor">${superficie} m2</span></div>
    <div class="detalle-lote-fila"><span>Estado</span><span class="valor ${claseEst}">${estadoTexto}</span></div>`;

  if (estado === 'Disponible') {
    filas += `<div class="detalle-lote-fila"><span>Precio Lista</span><span class="valor">${valorLista}</span></div>`;
  }

  return `<div class="detalle-lote">
    <div class="detalle-lote-titulo">Lote ${id}</div>
    ${filas}
  </div>`;
}

/* =========================================================================
   3) VISOR 360
   ========================================================================= */
const viewer = new Viewer({
  container: document.getElementById('viewer'),
  panorama: './img/loteo-360.jpg',
  navbar: ['zoom', 'fullscreen'],
  defaultZoomLvl: 20,
  plugins: [
    [MarkersPlugin, { markers: [] }],
  ],
});

const markersPlugin = viewer.getPlugin(MarkersPlugin);

viewer.addEventListener('ready', () => {
  fetch(requestURL)
    .then(r => r.json())
    .then(data => {
      const filas = data.values || [];

      Object.keys(LOTES_GEOMETRIA).forEach(id => {
        const fila = filas.find(row => row[0] === id);
        // Si el lote no esta en la planilla, lo salteamos (igual que el "continue" original)
        if (!fila) return;

        const estilo = estiloPorEstado(fila[2]);

        markersPlugin.addMarker({
          id: 'lote-' + id,
          polygonPixels: LOTES_GEOMETRIA[id],
          svgStyle: {
            fill: estilo.fill,
            stroke: estilo.stroke,
            strokeWidth: '2px',
          },
          tooltip: {
            content: tooltipHTML(fila),
            className: 'tooltip-lote',
            trigger: 'hover',
          },
        });

        // Numero de lote siempre visible, centrado en el poligono
        const centro = centroide(LOTES_GEOMETRIA[id]);
        markersPlugin.addMarker({
          id: 'label-' + id,
          position: { textureX: centro.x, textureY: centro.y },
          html: '<div class="lote-label" style="background-color:' + colorBadgePorEstado(fila[2]) + '">' + id + '</div>',
          anchor: 'center center',
          zIndex: 5,
        });
      });

      document.getElementById('loader-container').style.display = 'none';
    })
    .catch(err => {
      console.error('Error cargando datos de Sheets:', err);
      document.getElementById('loader-container').textContent =
        'No se pudo cargar la disponibilidad (revisa la consola).';
    });
});
</script>
</body>
</html>
